<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Papers Wiki</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #fafaf7;
    --bg-sidebar: #f0eee8;
    --bg-notes: #f5f3ec;
    --text: #1a1a1a;
    --muted: #666;
    --border: #d8d4c8;
    --accent: #b04d2a;
    --accent-soft: #f6dbc9;
    --code-bg: #ebe8e0;
    --link: #2a5fb0;
    --hl: #fff2a8;
    --hl-active: #ffd848;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a17;
      --bg-sidebar: #211f1b;
      --bg-notes: #1f1e1a;
      --text: #e8e6e0;
      --muted: #8a8780;
      --border: #2e2b25;
      --accent: #d97757;
      --accent-soft: #4a2a1a;
      --code-bg: #2a2723;
      --link: #7fa8e0;
      --hl: #6e5a14;
      --hl-active: #a08218;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    color: var(--text);
    background: var(--bg);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  /* ---------- sidebar ---------- */
  aside {
    width: 320px;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    padding: 1.5rem 1rem;
    overflow-y: auto;
    flex-shrink: 0;
  }
  aside h1 {
    font-size: 1.1rem;
    margin: 0 0 0.5rem 0;
    color: var(--accent);
    letter-spacing: 0.02em;
  }
  aside p.tagline {
    font-size: 0.85rem;
    color: var(--muted);
    margin: 0 0 1.5rem 0;
    line-height: 1.4;
  }
  aside input[type=search] {
    width: 100%;
    padding: 0.4rem 0.6rem;
    font-size: 0.9rem;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    margin-bottom: 1rem;
    font-family: inherit;
  }
  aside ul.papers { list-style: none; padding: 0; margin: 0; }
  aside ul.papers li {
    margin-bottom: 0.75rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px dotted var(--border);
  }
  aside ul.papers li:last-child { border-bottom: none; }
  aside ul.papers a {
    color: var(--text);
    text-decoration: none;
    display: block;
    font-size: 0.92rem;
    line-height: 1.35;
  }
  aside ul.papers a:hover { color: var(--accent); }
  aside ul.papers .meta {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 0.25rem;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  aside ul.papers a.active { color: var(--accent); font-weight: 600; }

  /* ---------- main ---------- */
  main { flex: 1; overflow-y: auto; padding: 2.5rem 3rem 8rem; max-width: none; }
  main article { max-width: 760px; margin: 0 auto; line-height: 1.6; }
  main h1 { font-size: 1.7rem; margin-top: 0; color: var(--text); }
  main h2 {
    font-size: 1.25rem;
    margin-top: 2rem;
    padding-bottom: 0.3rem;
    border-bottom: 1px solid var(--border);
    color: var(--accent);
  }
  main h3 { font-size: 1.05rem; margin-top: 1.5rem; }
  main p, main li { font-size: 1rem; }
  main code {
    background: var(--code-bg);
    padding: 0.1rem 0.35rem;
    border-radius: 3px;
    font-size: 0.88em;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  main pre {
    background: var(--code-bg);
    padding: 1rem;
    border-radius: 6px;
    overflow-x: auto;
    font-size: 0.85em;
    line-height: 1.45;
  }
  main pre code { background: none; padding: 0; }
  main a { color: var(--link); text-decoration: none; }
  main a:hover { text-decoration: underline; }
  main blockquote {
    border-left: 3px solid var(--accent);
    padding-left: 1rem;
    margin-left: 0;
    color: var(--muted);
    font-style: italic;
  }
  main table { border-collapse: collapse; width: 100%; font-size: 0.9rem; margin: 1rem 0; }
  main table th, main table td {
    border: 1px solid var(--border);
    padding: 0.4rem 0.6rem;
    text-align: left;
  }
  main table th { background: var(--bg-sidebar); }
  .empty { color: var(--muted); font-style: italic; text-align: center; margin-top: 4rem; }
  .error {
    color: #c44; background: #fee; border: 1px solid #fcc;
    padding: 1rem; border-radius: 4px; margin: 2rem 0;
  }
  .wiki-link {
    color: var(--accent);
    background: var(--code-bg);
    padding: 0.05rem 0.3rem;
    border-radius: 3px;
    text-decoration: none;
    font-size: 0.95em;
  }
  .wiki-link:hover { text-decoration: underline; }

  /* ---------- highlights inside the article ---------- */
  mark.user-hl {
    background: var(--hl);
    padding: 0.05rem 0.1rem;
    border-radius: 2px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  mark.user-hl:hover, mark.user-hl.active { background: var(--hl-active); }

  /* ---------- floating "Add note" button ---------- */
  #hl-toolbar {
    position: absolute;
    z-index: 30;
    background: var(--text);
    color: var(--bg);
    padding: 0.35rem 0.7rem;
    border-radius: 4px;
    font-size: 0.85rem;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    display: none;
    user-select: none;
  }
  #hl-toolbar::after {
    content: ""; position: absolute; bottom: -5px; left: 12px;
    border-left: 5px solid transparent; border-right: 5px solid transparent;
    border-top: 5px solid var(--text);
  }

  /* ---------- tab switcher (Papers / Theses) ---------- */
  .tabs {
    display: flex;
    gap: 0;
    margin-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }
  .tabs button {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--muted);
    font-family: inherit;
    font-size: 0.9rem;
    padding: 0.5rem 0.6rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tabs button.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
    font-weight: 600;
  }
  .tabs .count {
    color: var(--muted);
    font-weight: 400;
    font-size: 0.78rem;
    margin-left: 0.25rem;
  }

  /* ---------- thesis listing in sidebar ---------- */
  aside ul.theses {
    list-style: none; padding: 0; margin: 0;
  }
  aside ul.theses li {
    margin-bottom: 0.75rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px dotted var(--border);
  }
  aside ul.theses li:last-child { border-bottom: none; }
  aside ul.theses a {
    color: var(--text);
    text-decoration: none;
    display: block;
    font-size: 0.88rem;
    line-height: 1.4;
  }
  aside ul.theses a:hover { color: var(--accent); }
  aside ul.theses a.active { color: var(--accent); font-weight: 600; }
  aside ul.theses .chips {
    margin-top: 0.3rem;
    display: flex; flex-wrap: wrap; gap: 0.3rem;
    font-size: 0.7rem;
    font-family: ui-monospace, monospace;
  }

  /* ---------- status / gap chips (used in both sidebar and thesis page) ---------- */
  .chip {
    display: inline-block;
    padding: 0.05rem 0.45rem;
    border-radius: 10px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.75em;
    line-height: 1.5;
    vertical-align: middle;
  }
  .chip-status-open { background: #d4f0d4; color: #2a5d2a; }
  .chip-status-resolved-yes { background: #cfe4ff; color: #1a3d77; }
  .chip-status-resolved-no { background: #ffd4d4; color: #802020; }
  .chip-status-partially-resolved { background: #fff2a8; color: #6e5a14; }
  .chip-status-stale-pending-review { background: #ffe1b5; color: #7a4a0e; }
  .chip-gap { background: var(--code-bg); color: var(--text); }
  .chip-falsif-high { background: #d4f0d4; color: #2a5d2a; }
  .chip-falsif-medium { background: #fff2a8; color: #6e5a14; }
  .chip-falsif-low { background: #f0d4d4; color: #802020; }
  @media (prefers-color-scheme: dark) {
    .chip-status-open { background: #1f3a1f; color: #a8d8a8; }
    .chip-status-resolved-yes { background: #16294a; color: #8db4e8; }
    .chip-status-resolved-no { background: #4a1f1f; color: #e8a8a8; }
    .chip-status-partially-resolved { background: #4a3f1f; color: #e8d18d; }
    .chip-status-stale-pending-review { background: #4a3318; color: #e8c08d; }
    .chip-falsif-high { background: #1f3a1f; color: #a8d8a8; }
    .chip-falsif-medium { background: #4a3f1f; color: #e8d18d; }
    .chip-falsif-low { background: #4a1f1f; color: #e8a8a8; }
  }

  /* ---------- thesis page layout ---------- */
  .thesis-meta-bar {
    display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center;
    padding: 0.75rem 0;
    margin-bottom: 1rem;
    border-bottom: 1px solid var(--border);
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  .thesis-meta-bar .label {
    font-size: 0.78rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .thesis-claim-callout, .thesis-falsify-callout {
    border-left: 3px solid var(--accent);
    padding: 0.6rem 1rem;
    background: var(--bg-sidebar);
    margin: 1rem 0;
    border-radius: 0 4px 4px 0;
  }
  .thesis-falsify-callout { border-left-color: #b08d2a; }

  /* ---------- per-paper footer: theses involving this paper ---------- */
  .related-theses {
    max-width: 760px;
    margin: 3rem auto 0;
    padding-top: 1.5rem;
    border-top: 2px solid var(--border);
  }
  .related-theses h2 {
    font-size: 1.05rem;
    margin: 0 0 0.8rem 0;
    color: var(--accent);
    border: none;
    padding: 0;
    font-family: inherit;
  }
  .related-theses ul { list-style: none; padding: 0; margin: 0; }
  .related-theses li {
    padding: 0.6rem 0.8rem;
    border-left: 2px solid var(--border);
    margin-bottom: 0.5rem;
    background: var(--bg-sidebar);
    border-radius: 0 4px 4px 0;
  }
  .related-theses a {
    color: var(--text);
    text-decoration: none;
    display: block;
    line-height: 1.4;
    font-size: 0.92rem;
  }
  .related-theses a:hover { color: var(--accent); }
  .related-theses .meta-row {
    margin-top: 0.3rem;
    display: flex; gap: 0.3rem; flex-wrap: wrap;
  }
  .related-theses .none {
    color: var(--muted); font-style: italic;
    font-size: 0.9rem;
  }

  /* ---------- modal ---------- */
  #modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 40;
    display: none;
    align-items: center; justify-content: center;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  #modal-overlay.open { display: flex; }
  #modal {
    width: min(560px, 92vw);
    max-height: 86vh;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.25);
    padding: 1.5rem;
    display: flex; flex-direction: column;
    gap: 1rem;
    overflow: auto;
  }
  #modal h2 { font-family: inherit; margin: 0; font-size: 1.05rem; color: var(--accent); border: none; padding: 0; }
  #modal .preview {
    font-family: ui-serif, Georgia, serif;
    background: var(--bg-sidebar);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.7rem 0.9rem;
    font-size: 0.92rem;
    line-height: 1.5;
    max-height: 12rem;
    overflow: auto;
  }
  #modal .preview .ctx { color: var(--muted); }
  #modal .preview .hl { background: var(--hl); padding: 0 0.1rem; }
  #modal label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 0.3rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  #modal textarea {
    width: 100%;
    min-height: 7rem;
    padding: 0.6rem;
    font-family: ui-serif, Georgia, serif;
    font-size: 1rem;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    resize: vertical;
  }
  #modal .actions { display: flex; gap: 0.5rem; justify-content: flex-end; }
  #modal button {
    padding: 0.5rem 1rem;
    font-family: inherit;
    font-size: 0.9rem;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
  }
  #modal button.primary {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  #modal button:disabled { opacity: 0.5; cursor: not-allowed; }
  #modal .target {
    font-size: 0.8rem;
    color: var(--muted);
    font-family: ui-monospace, monospace;
  }
  #modal .err {
    color: #c44; background: #fee; border: 1px solid #fcc;
    padding: 0.5rem 0.7rem; border-radius: 4px; font-size: 0.85rem;
    display: none;
  }
  #modal .err.show { display: block; }

  /* ---------- notes footer ---------- */
  #notes-panel {
    max-width: 760px;
    margin: 4rem auto 0;
    padding-top: 1.5rem;
    border-top: 2px solid var(--border);
  }
  #notes-panel h2 {
    font-size: 1.1rem;
    color: var(--accent);
    margin: 0 0 1rem 0;
    border: none;
    padding: 0;
  }
  #notes-panel .note {
    background: var(--bg-notes);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    padding: 0.9rem 1.1rem;
    margin-bottom: 1rem;
    scroll-margin-top: 1rem;
    transition: border-color 0.2s, background 0.2s;
    cursor: pointer;
  }
  #notes-panel .note.active { border-left-color: var(--hl-active); background: var(--accent-soft); }
  #notes-panel .note blockquote {
    border-left: 2px solid var(--border);
    margin: 0 0 0.5rem 0;
    padding-left: 0.7rem;
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.4;
  }
  #notes-panel .note .body { font-size: 0.95rem; line-height: 1.5; }
  #notes-panel .note .body p:first-child { margin-top: 0; }
  #notes-panel .note .body p:last-child { margin-bottom: 0; }
  #notes-panel .note-meta {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 0.75rem; color: var(--muted); margin-top: 0.5rem;
    font-family: ui-monospace, monospace;
  }
  #notes-panel .note-meta button {
    background: none; border: none; color: var(--muted);
    cursor: pointer; font-family: inherit; font-size: 0.75rem;
    padding: 0.1rem 0.4rem; border-radius: 3px;
  }
  #notes-panel .note-meta button:hover { color: #c44; background: #fee2; }
  #notes-panel .no-notes { color: var(--muted); font-style: italic; font-size: 0.9rem; }
</style>
</head>
<body>
<aside>
  <h1>Papers Wiki</h1>
  <p class="tagline">Digested literature + cross-paper theses.</p>
  <div class="tabs">
    <button id="tab-papers" class="active" data-tab="papers">Papers <span class="count" id="count-papers"></span></button>
    <button id="tab-theses" data-tab="theses">Theses <span class="count" id="count-theses"></span></button>
  </div>
  <input type="search" id="filter" placeholder="Filter…">
  <ul class="papers" id="papers"></ul>
  <ul class="theses" id="theses" hidden></ul>
</aside>
<main>
  <article id="content">
    <p class="empty">Pick a paper from the sidebar, or run <code>/digest-paper &lt;url&gt;</code> to add one.</p>
  </article>
  <section id="notes-panel" hidden>
    <h2>Notes</h2>
    <div id="notes-list"></div>
  </section>
</main>

<div id="hl-toolbar">＋ Add note</div>

<div id="modal-overlay">
  <div id="modal">
    <h2>New note</h2>
    <div>
      <label>Highlighted passage</label>
      <div class="preview" id="modal-preview"></div>
    </div>
    <div>
      <label for="modal-note">Your note</label>
      <textarea id="modal-note" placeholder="What's worth remembering about this passage? Supports markdown."></textarea>
    </div>
    <div class="target" id="modal-target"></div>
    <div class="err" id="modal-err"></div>
    <div class="actions">
      <button id="modal-cancel">Cancel</button>
      <button id="modal-save" class="primary">Save note</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<script>
// =========================================================================
// FRONTMATTER + WIKI-LINKS
// =========================================================================

function parseFrontmatter(md) {
  const match = md.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
  if (!match) return { meta: {}, body: md };
  const meta = {};
  const lines = match[1].split('\n');
  let currentList = null;
  let currentObj = null;        // for nested objects like `generated_by:`
  let currentObjKey = null;

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    // Top-level "key: value" or "key:"
    const topKv = line.match(/^(\w+):\s*(.*)$/);
    if (topKv) {
      const k = topKv[1];
      const v = topKv[2].trim();
      currentObj = null; currentObjKey = null; currentList = null;
      if (v === '') {
        // Peek next non-empty line to decide list vs object vs empty
        let j = i + 1;
        while (j < lines.length && lines[j].trim() === '') j++;
        const next = lines[j] || '';
        if (next.startsWith('  - ')) {
          meta[k] = [];
          currentList = meta[k];
        } else if (/^\s+\w+:/.test(next)) {
          meta[k] = {};
          currentObj = meta[k];
          currentObjKey = k;
        } else {
          meta[k] = null;
        }
      } else {
        meta[k] = v.replace(/^["']|["']$/g, '');
      }
      continue;
    }
    // Indented list entry
    if (line.startsWith('  - ') && currentList) {
      currentList.push(line.slice(4).replace(/^["']|["']$/g, ''));
      continue;
    }
    // Nested object key
    const nestedKv = line.match(/^\s+(\w+):\s*(.*)$/);
    if (nestedKv && currentObj) {
      currentObj[nestedKv[1]] = nestedKv[2].trim().replace(/^["']|["']$/g, '');
    }
  }
  return { meta, body: match[2] };
}

function renderWikiLinks(html) {
  return html.replace(/\[\[([\w\-]+)\]\]/g,
    (_, slug) => `<a class="wiki-link" href="#${slug}">[[${slug}]]</a>`);
}

function escapeHtml(s) {
  return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// =========================================================================
// INDEX + DOCUMENT LOAD (papers + theses)
// =========================================================================

async function loadPapersIndex() {
  try {
    const res = await fetch('INDEX.md');
    if (!res.ok) throw new Error('Could not load INDEX.md');
    const md = await res.text();
    const papers = [];
    const rows = md.matchAll(/^\|\s*(\d{4}-\d{2}-\d{2})\s*\|\s*\[([^\]]+)\]\(([^)]+\.md)\)\s*\|\s*([^|]+?)\s*\|\s*(\d{4})\s*\|\s*`([^`]+)`\s*\|/gm);
    for (const row of rows) {
      const [, date, title, file, author, year, lens] = row;
      papers.push({
        slug: file.replace(/\.md$/, ''),
        title: title.trim(), file, date,
        author: author.trim(), year, lens,
        kind: 'paper'
      });
    }
    return papers;
  } catch (e) {
    document.getElementById('papers').innerHTML =
      `<li class="error">Could not load papers INDEX.md.</li>`;
    return [];
  }
}

async function loadThesesIndex() {
  try {
    const res = await fetch('/theses/INDEX.md');
    if (!res.ok) throw new Error('Could not load theses INDEX.md');
    const md = await res.text();
    const theses = [];
    // Row format: | date | [title](slug.md) | gap | status | n_sup | falsif | cluster |
    const rows = md.matchAll(/^\|\s*(\d{4}-\d{2}-\d{2})\s*\|\s*\[([^\]]+)\]\(([^)]+\.md)\)\s*\|\s*([^|]+?)\s*\|\s*([^|]+?)\s*\|\s*(\d+)\s*\|\s*([HML])\s*\|\s*([^|]+?)\s*\|/gm);
    for (const row of rows) {
      const [, date, title, file, gap, status, nSup, falsif, cluster] = row;
      theses.push({
        slug: file.replace(/\.md$/, ''),
        title: title.trim(),
        file: '/theses/' + file,
        date,
        gap: gap.trim(),
        status: status.trim(),
        nSup: parseInt(nSup, 10),
        falsif: falsif.trim(),
        cluster: cluster.trim(),
        kind: 'thesis'
      });
    }
    return theses;
  } catch (e) {
    document.getElementById('theses').innerHTML =
      `<li class="empty" style="margin:1rem 0">No theses yet. Run <code>/flow-frontier --topic="..."</code> to mine some.</li>`;
    return [];
  }
}

let manifestCache = null;
async function loadThesesManifest() {
  if (manifestCache !== null) return manifestCache;
  try {
    const res = await fetch('/theses/_manifest.json');
    if (!res.ok) throw new Error('no manifest');
    manifestCache = await res.json();
  } catch (e) {
    manifestCache = { theses_by_paper: {}, clusters: {} };
  }
  return manifestCache;
}

// Strip the chip text to a clean status key for CSS class
function statusKey(s) {
  return s.toLowerCase().replace(/[^a-z-]/g, '').replace(/^[a-z]+(open|resolved-yes|resolved-no|partially-resolved|stale-pending-review)/, '$1');
}

function statusChip(rawStatus) {
  // rawStatus is something like "🟢 open" or "⚠️ stale" from the index; normalize to key
  const map = {
    'open': 'open',
    'verified': 'resolved-yes',
    'resolvedyes': 'resolved-yes',
    'falsified': 'resolved-no',
    'resolvedno': 'resolved-no',
    'partial': 'partially-resolved',
    'partiallyresolved': 'partially-resolved',
    'stale': 'stale-pending-review',
    'stalependingreview': 'stale-pending-review'
  };
  const clean = (rawStatus || '').toLowerCase().replace(/[^a-z-]/g, '');
  const key = map[clean.replace(/-/g, '')] || 'open';
  return `<span class="chip chip-status-${key}">${rawStatus || 'open'}</span>`;
}

function renderSidebar(filter = '') {
  const f = filter.toLowerCase();
  if (currentTab === 'papers') {
    const ul = document.getElementById('papers');
    const filtered = allPapers.filter(p =>
      !f || p.title.toLowerCase().includes(f) ||
      p.author.toLowerCase().includes(f) ||
      p.lens.toLowerCase().includes(f) ||
      p.slug.toLowerCase().includes(f)
    );
    if (filtered.length === 0) {
      ul.innerHTML = '<li class="empty" style="margin:1rem 0">No matching papers.</li>';
      return;
    }
    ul.innerHTML = filtered.map(p => `
      <li>
        <a href="#${p.slug}" data-slug="${p.slug}">${escapeHtml(p.title)}</a>
        <div class="meta">${escapeHtml(p.author)} · ${p.year} · ${escapeHtml(p.lens)}</div>
      </li>
    `).join('');
  } else {
    const ul = document.getElementById('theses');
    const filtered = allTheses.filter(t =>
      !f || t.title.toLowerCase().includes(f) ||
      t.gap.toLowerCase().includes(f) ||
      t.cluster.toLowerCase().includes(f) ||
      t.slug.toLowerCase().includes(f)
    );
    if (filtered.length === 0) {
      ul.innerHTML = '<li class="empty" style="margin:1rem 0">No matching theses.</li>';
      return;
    }
    ul.innerHTML = filtered.map(t => `
      <li>
        <a href="#${t.slug}" data-slug="${t.slug}">${escapeHtml(t.title)}</a>
        <div class="chips">
          ${statusChip(t.status)}
          <span class="chip chip-gap">${escapeHtml(t.gap)}</span>
          <span class="chip chip-falsif-${t.falsif === 'H' ? 'high' : t.falsif === 'M' ? 'medium' : 'low'}">${t.nSup} src · falsif ${t.falsif}</span>
        </div>
      </li>
    `).join('');
  }
}

function switchTab(tabName) {
  currentTab = tabName;
  document.getElementById('tab-papers').classList.toggle('active', tabName === 'papers');
  document.getElementById('tab-theses').classList.toggle('active', tabName === 'theses');
  document.getElementById('papers').hidden = (tabName !== 'papers');
  document.getElementById('theses').hidden = (tabName !== 'theses');
  document.getElementById('filter').placeholder = tabName === 'papers'
    ? 'Filter by title, author, lens…'
    : 'Filter by title, gap-type, cluster…';
  renderSidebar(document.getElementById('filter').value);
}

// =========================================================================
// CURRENT-DOCUMENT STATE (paper or thesis)
// =========================================================================

let currentSlug = null;
let currentNotes = [];
let currentKind = null;     // 'paper' | 'thesis'

async function loadDocument(slug) {
  const article = document.getElementById('content');
  const notesPanel = document.getElementById('notes-panel');
  article.innerHTML = '<p class="empty">Loading…</p>';
  notesPanel.hidden = true;
  currentSlug = slug;
  currentNotes = [];
  currentKind = null;

  // Try thesis first (cheap manifest hit), fall back to paper
  const inTheses = allTheses.some(t => t.slug === slug);
  const inPapers = allPapers.some(p => p.slug === slug);

  let url, kind;
  if (inTheses) {
    url = `/theses/${slug}.md`; kind = 'thesis';
  } else if (inPapers) {
    url = `${slug}.md`; kind = 'paper';
  } else {
    // Not in either index — try paper path first, then thesis
    url = `${slug}.md`; kind = 'paper';
  }

  try {
    let res = await fetch(url);
    if (!res.ok && kind === 'paper') {
      // Try theses as fallback
      res = await fetch(`/theses/${slug}.md`);
      if (res.ok) { url = `/theses/${slug}.md`; kind = 'thesis'; }
    }
    if (!res.ok) throw new Error(`Not found: ${slug}.md`);

    const md = await res.text();
    const { meta, body } = parseFrontmatter(md);
    currentKind = meta.kind || kind;

    if (currentKind === 'thesis' || currentKind === 'paper-notes') {
      renderThesis(slug, meta, body);
    } else {
      await renderPaper(slug, meta, body);
    }

    article.scrollTop = 0;
    // Mark active in BOTH sidebars
    document.querySelectorAll('#papers a, #theses a').forEach(a => {
      a.classList.toggle('active', a.dataset.slug === slug);
    });
    document.title = `${meta.title || slug} · Papers Wiki`;
  } catch (e) {
    article.innerHTML = `<div class="error">Could not load <code>${slug}.md</code>: ${e.message}</div>`;
  }
}

async function renderPaper(slug, meta, body) {
  const article = document.getElementById('content');
  let html = marked.parse(body);
  html = renderWikiLinks(html);
  article.innerHTML = html;
  // Append "Theses involving this paper" footer
  const footerHtml = await renderPaperFooter(slug);
  article.insertAdjacentHTML('beforeend', footerHtml);
  await loadAndRenderNotes(slug);
}

async function renderPaperFooter(slug) {
  const manifest = await loadThesesManifest();
  const thesisSlugs = (manifest.theses_by_paper && manifest.theses_by_paper[slug]) || [];
  if (thesisSlugs.length === 0) {
    return `
      <section class="related-theses">
        <h2>Theses involving this paper</h2>
        <p class="none">None yet. Run <code>/flow-frontier --topic="…"</code> on a cluster that includes this paper to surface cross-paper questions involving it.</p>
      </section>
    `;
  }
  // Look up each thesis in allTheses for metadata
  const items = thesisSlugs.map(ts => {
    const t = allTheses.find(x => x.slug === ts);
    if (!t) return `<li><a href="#${ts}">${ts}</a> <span class="meta">(metadata unavailable)</span></li>`;
    return `
      <li>
        <a href="#${t.slug}">${escapeHtml(t.title)}</a>
        <div class="meta-row">
          ${statusChip(t.status)}
          <span class="chip chip-gap">${escapeHtml(t.gap)}</span>
          <span class="chip chip-falsif-${t.falsif === 'H' ? 'high' : t.falsif === 'M' ? 'medium' : 'low'}">falsif ${t.falsif}</span>
          <span class="chip chip-gap">${t.nSup} sources</span>
        </div>
      </li>
    `;
  }).join('');
  return `
    <section class="related-theses">
      <h2>Theses involving this paper (${thesisSlugs.length})</h2>
      <ul>${items}</ul>
    </section>
  `;
}

function renderThesis(slug, meta, body) {
  const article = document.getElementById('content');
  // Pull the most useful fields from frontmatter
  const gapTypes = Array.isArray(meta.gap_type) ? meta.gap_type : (meta.gap_type ? [meta.gap_type] : []);
  const status = meta.status || 'open';
  const falsif = meta.falsifiability || 'medium';
  const cluster = (meta.generated_by && meta.generated_by.cluster) || (meta.generated_by ? '(unknown cluster)' : null);
  const generatedDate = (meta.generated_date || '').slice(0, 10);
  const staleReason = meta.stale_reason && meta.stale_reason !== 'null' ? meta.stale_reason : null;

  let html = '<div class="thesis-meta-bar">';
  html += statusChip(status);
  for (const gt of gapTypes) {
    html += ` <span class="chip chip-gap">${escapeHtml(gt)}</span>`;
  }
  html += ` <span class="chip chip-falsif-${falsif}">falsifiability: ${falsif}</span>`;
  if (generatedDate) html += ` <span class="label">· generated ${generatedDate}</span>`;
  if (cluster) html += ` <span class="label">· cluster <code>${escapeHtml(cluster)}</code></span>`;
  html += '</div>';

  if (staleReason) {
    html += `<div class="error" style="background:#fff2a8;color:#6e5a14;border-color:#e8d18d">`
         +  `⚠️ <strong>Stale:</strong> ${escapeHtml(staleReason)}`
         +  `<div style="margin-top:0.6rem;font-size:0.88em;color:#5a4a14">`
         +  `<strong>To clear:</strong> run <code style="background:#f0e6c0;padding:0.05rem 0.3rem;border-radius:3px">/verify-thesis ${escapeHtml(slug)}</code> `
         +  `(or <code style="background:#f0e6c0;padding:0.05rem 0.3rem;border-radius:3px">/verify-thesis --status=stale-pending-review</code> to batch all stale theses). `
         +  `The verifier searches the literature, sets a new status (resolved-yes / resolved-no / partial / open), and removes the stale flag automatically. `
         +  `Or edit this file's frontmatter manually if you've already eyeballed it.`
         +  `</div></div>`;
  }

  // Render the markdown body
  let bodyHtml = marked.parse(body);
  bodyHtml = renderWikiLinks(bodyHtml);

  html += bodyHtml;
  article.innerHTML = html;
  // Theses don't support notes in v1.5 — keep the notes panel hidden
  document.getElementById('notes-panel').hidden = true;
}

// =========================================================================
// NOTES: load, render, anchor
// =========================================================================

async function loadAndRenderNotes(slug) {
  try {
    const res = await fetch(`/api/notes/${encodeURIComponent(slug)}`);
    if (!res.ok) {
      console.warn('Notes API not reachable; static mode (no annotations)');
      currentNotes = [];
    } else {
      const data = await res.json();
      currentNotes = data.notes || [];
    }
  } catch (e) {
    console.warn('Notes API not reachable:', e);
    currentNotes = [];
  }
  reapplyHighlights();
  renderNotesPanel();
}

function flattenArticleText() {
  const article = document.getElementById('content');
  const walker = document.createTreeWalker(article, NodeFilter.SHOW_TEXT, {
    acceptNode: (n) => (n.parentElement && n.parentElement.closest('pre, code, .wiki-link, mark.user-hl'))
      ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT
  });
  let full = '';
  const nodes = [];
  const starts = [];
  while (walker.nextNode()) {
    const n = walker.currentNode;
    starts.push(full.length);
    nodes.push(n);
    full += n.nodeValue;
  }
  return { full, nodes, starts };
}

function reapplyHighlights() {
  // Remove existing highlights so we can re-anchor cleanly
  document.querySelectorAll('mark.user-hl').forEach(m => {
    const parent = m.parentNode;
    while (m.firstChild) parent.insertBefore(m.firstChild, m);
    parent.removeChild(m);
    parent.normalize();
  });
  for (const n of currentNotes) {
    try { applyHighlight(n); } catch (e) { console.warn('Highlight failed for', n.id, e); }
  }
}

function applyHighlight(note) {
  const search = (note.prefix || '') + (note.exact || '') + (note.suffix || '');
  if (!search) return false;
  const { full, nodes, starts } = flattenArticleText();
  const idx = full.indexOf(search);
  if (idx === -1) return false;
  const startInFull = idx + (note.prefix || '').length;
  const endInFull = startInFull + (note.exact || '').length;
  if (endInFull <= startInFull) return false;

  function nodeAt(globalPos) {
    for (let i = 0; i < nodes.length; i++) {
      const s = starts[i];
      const e = s + nodes[i].nodeValue.length;
      if (globalPos >= s && globalPos <= e) return { node: nodes[i], offset: globalPos - s };
    }
    return null;
  }
  const startPt = nodeAt(startInFull);
  const endPt = nodeAt(endInFull);
  if (!startPt || !endPt) return false;

  const targets = [];
  if (startPt.node === endPt.node) {
    targets.push({ node: startPt.node, from: startPt.offset, to: endPt.offset });
  } else {
    targets.push({ node: startPt.node, from: startPt.offset, to: startPt.node.nodeValue.length });
    let started = false;
    for (const n of nodes) {
      if (n === startPt.node) { started = true; continue; }
      if (n === endPt.node) break;
      if (started) targets.push({ node: n, from: 0, to: n.nodeValue.length });
    }
    targets.push({ node: endPt.node, from: 0, to: endPt.offset });
  }

  for (const t of targets) {
    if (t.to <= t.from) continue;
    const before = t.node.nodeValue.slice(0, t.from);
    const middle = t.node.nodeValue.slice(t.from, t.to);
    const after = t.node.nodeValue.slice(t.to);
    const mark = document.createElement('mark');
    mark.className = 'user-hl';
    mark.dataset.noteId = note.id;
    mark.textContent = middle;
    mark.title = 'Click to scroll to note';
    mark.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const target = document.getElementById('note-' + note.id);
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        target.classList.add('active');
        setTimeout(() => target.classList.remove('active'), 1600);
      }
    });
    const parent = t.node.parentNode;
    const next = t.node.nextSibling;
    parent.removeChild(t.node);
    if (before) parent.insertBefore(document.createTextNode(before), next);
    parent.insertBefore(mark, next);
    if (after) parent.insertBefore(document.createTextNode(after), next);
  }
  return true;
}

function renderNotesPanel() {
  const list = document.getElementById('notes-list');
  const panel = document.getElementById('notes-panel');
  panel.hidden = false;
  if (currentNotes.length === 0) {
    list.innerHTML = '<p class="no-notes">No notes yet. Highlight a passage above to add one.</p>';
    return;
  }
  list.innerHTML = currentNotes.map(n => {
    const noteHtml = marked.parse(n.note || '');
    const dateStr = (n.created || '').slice(0, 10);
    const exactEsc = escapeHtml(n.exact || '');
    return `
      <div class="note" id="note-${n.id}" data-note-id="${n.id}">
        <blockquote>${exactEsc}</blockquote>
        <div class="body">${noteHtml}</div>
        <div class="note-meta">
          <span>${n.id} · ${dateStr}</span>
          <button data-del="${n.id}" title="Delete note">delete</button>
        </div>
      </div>
    `;
  }).join('');
  list.querySelectorAll('button[data-del]').forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); deleteNote(btn.dataset.del); });
  });
  list.querySelectorAll('.note').forEach(noteEl => {
    noteEl.addEventListener('click', (e) => {
      if (e.target.closest('button')) return;
      const nid = noteEl.dataset.noteId;
      const mark = document.querySelector(`mark.user-hl[data-note-id="${nid}"]`);
      if (mark) {
        mark.scrollIntoView({ behavior: 'smooth', block: 'center' });
        mark.classList.add('active');
        setTimeout(() => mark.classList.remove('active'), 1600);
      }
    });
  });
}

// =========================================================================
// SELECTION → TOOLBAR → MODAL
// =========================================================================

const toolbar = document.getElementById('hl-toolbar');
let pendingSelection = null;

function captureSelection() {
  // Annotations only work on paper pages in v1.5; theses don't yet support notes
  if (currentKind === 'thesis') return null;
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed) return null;
  const range = sel.getRangeAt(0);
  const article = document.getElementById('content');
  if (!article.contains(range.commonAncestorContainer)) return null;
  const startEl = range.startContainer.parentElement;
  if (startEl && startEl.closest('mark.user-hl')) return null;
  const exact = sel.toString();
  if (!exact || exact.trim().length < 3) return null;

  const { full, nodes, starts } = flattenArticleText();
  function globalPos(node, offset) {
    const i = nodes.indexOf(node);
    if (i === -1) return -1;
    return starts[i] + offset;
  }
  const s = globalPos(range.startContainer, range.startOffset);
  const e = globalPos(range.endContainer, range.endOffset);
  if (s < 0 || e < 0 || e <= s) return null;

  const CTX = 50;
  const prefix = full.slice(Math.max(0, s - CTX), s);
  const suffix = full.slice(e, Math.min(full.length, e + CTX));
  return { prefix, exact, suffix, range };
}

function showToolbarForSelection() {
  const cap = captureSelection();
  if (!cap) { toolbar.style.display = 'none'; return; }
  pendingSelection = cap;
  const rect = cap.range.getBoundingClientRect();
  if (rect.width === 0 && rect.height === 0) { toolbar.style.display = 'none'; return; }
  toolbar.style.display = 'block';
  toolbar.style.top = (window.scrollY + rect.top - toolbar.offsetHeight - 8) + 'px';
  toolbar.style.left = (window.scrollX + rect.left) + 'px';
}

document.addEventListener('mouseup', () => setTimeout(showToolbarForSelection, 0));
document.addEventListener('mousedown', (e) => {
  if (!e.target.closest('#hl-toolbar')) toolbar.style.display = 'none';
});
document.addEventListener('keyup', (e) => {
  if (e.key === 'Escape') toolbar.style.display = 'none';
});
toolbar.addEventListener('click', () => {
  if (!pendingSelection) return;
  openModal(pendingSelection);
  toolbar.style.display = 'none';
});

// =========================================================================
// MODAL
// =========================================================================

const overlay = document.getElementById('modal-overlay');
const modalPreview = document.getElementById('modal-preview');
const modalNote = document.getElementById('modal-note');
const modalTarget = document.getElementById('modal-target');
const modalErr = document.getElementById('modal-err');
const modalCancel = document.getElementById('modal-cancel');
const modalSave = document.getElementById('modal-save');

function openModal({ prefix, exact, suffix }) {
  modalPreview.innerHTML =
    `<span class="ctx">${escapeHtml(prefix)}</span>` +
    `<span class="hl">${escapeHtml(exact)}</span>` +
    `<span class="ctx">${escapeHtml(suffix)}</span>`;
  modalNote.value = '';
  modalTarget.textContent = `paper: ${currentSlug}`;
  modalErr.classList.remove('show');
  modalErr.textContent = '';
  overlay.classList.add('open');
  setTimeout(() => modalNote.focus(), 50);
  modalSave.onclick = async () => {
    modalSave.disabled = true;
    modalErr.classList.remove('show');
    try {
      const res = await fetch(`/api/notes/${encodeURIComponent(currentSlug)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prefix, exact, suffix, note: modalNote.value })
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error || `HTTP ${res.status}`);
      }
      const created = await res.json();
      currentNotes.push(created);
      reapplyHighlights();
      renderNotesPanel();
      overlay.classList.remove('open');
      window.getSelection().removeAllRanges();
      const target = document.getElementById('note-' + created.id);
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        target.classList.add('active');
        setTimeout(() => target.classList.remove('active'), 1600);
      }
    } catch (err) {
      modalErr.textContent = 'Save failed: ' + err.message;
      modalErr.classList.add('show');
    } finally {
      modalSave.disabled = false;
    }
  };
}

modalCancel.addEventListener('click', () => overlay.classList.remove('open'));
overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('open'); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && overlay.classList.contains('open')) overlay.classList.remove('open');
});

// =========================================================================
// DELETE
// =========================================================================

async function deleteNote(nid) {
  if (!confirm('Delete this note?')) return;
  try {
    const res = await fetch(`/api/notes/${encodeURIComponent(currentSlug)}/${encodeURIComponent(nid)}`, { method: 'DELETE' });
    if (!res.ok && res.status !== 204) {
      const body = await res.json().catch(() => ({}));
      alert('Delete failed: ' + (body.error || `HTTP ${res.status}`));
      return;
    }
    currentNotes = currentNotes.filter(n => n.id !== nid);
    reapplyHighlights();
    renderNotesPanel();
  } catch (err) {
    alert('Delete failed: ' + err.message);
  }
}

// =========================================================================
// MAIN
// =========================================================================

let allPapers = [];
let allTheses = [];
let currentTab = 'papers';

(async () => {
  // Load both indices in parallel
  [allPapers, allTheses] = await Promise.all([loadPapersIndex(), loadThesesIndex()]);
  document.getElementById('count-papers').textContent = allPapers.length;
  document.getElementById('count-theses').textContent = allTheses.length;
  // If we have theses but no papers, default to theses tab
  if (allTheses.length > 0 && allPapers.length === 0) currentTab = 'theses';
  switchTab(currentTab);

  function routeFromHash() {
    const slug = location.hash.slice(1);
    if (slug) {
      // Auto-switch tab to match the document being loaded, so the sidebar highlight makes sense
      if (allTheses.some(t => t.slug === slug) && currentTab !== 'theses') switchTab('theses');
      else if (allPapers.some(p => p.slug === slug) && currentTab !== 'papers') switchTab('papers');
      loadDocument(slug);
    }
  }
  window.addEventListener('hashchange', routeFromHash);
  routeFromHash();

  document.getElementById('filter').addEventListener('input', e => {
    renderSidebar(e.target.value);
  });

  document.querySelectorAll('.tabs button').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });
})();
</script>
